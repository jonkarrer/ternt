[package]
name = "ternt"
version = "0.22.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ternt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The agent sidecar (agent/) is a workspace member so `cargo build -p ternt-agent`
# can run before this crate: Tauri's build script checks that the binary named in
# bundle.externalBin exists (scripts/sidecar.sh puts it in binaries/).
[workspace]
members = ["agent"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multiple webviews per window (UI + one per tab).
# `macos-private-api` enables transparent windows/webviews for the vibrancy sidebar.
# `devtools` lets web pages be inspected in release builds too (⌥⌘I).
tauri = { version = "2", features = ["unstable", "macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# `process` and `io-util` run the agent sidecar (src/agent/sidecar.rs).
tokio = { version = "1", features = ["sync", "time", "process", "io-util"] }
# The user's API keys for the agents, in the Keychain (src/agent/keys.rs).
keyring = { version = "3", features = ["apple-native"] }
# Signals to the agent sidecar (src/agent/sidecar.rs).
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
portable-pty = "0.9.0"
# Air Traffic Control's regex rules (src/routing.rs).
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
# Site icons for favorites (src/icons.rs). The updater already builds both,
# with these features.
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
# A shell's working directory, so new terminal panes start beside it.
libc = "0.2"
# "exception": catch Objective-C exceptions before they reach Rust frames.
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBox", "NSColor", "NSEvent", "NSGraphics", "NSResponder", "NSView", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
# WebKit's configuration for a view a page opens (see native::create_web_view).
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebViewConfiguration"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSKeyValueObserving", "NSString", "NSURL", "objc2-core-foundation"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
