[package]
name = "ternt"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ternt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multiple webviews per window (UI + one per tab).
# `macos-private-api` enables transparent windows/webviews for the vibrancy sidebar.
tauri = { version = "2", features = ["unstable", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
# Site icons for favorites (src/icons.rs). The updater already builds both,
# with these features.
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBox", "NSColor", "NSEvent", "NSGraphics", "NSResponder", "NSView", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSKeyValueObserving", "NSString", "NSURL", "objc2-core-foundation"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
