[workspace]
resolver = "3"
# Becomes ["crates/*"] once the first crate exists (cargo rejects a pattern that matches nothing).
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

# Shared dependency versions: crates opt in with `name.workspace = true`.
[workspace.dependencies]
tokio = { version = "1.54", features = ["full"] }
reqwest = "0.13.5"
anyhow = "1.0.104"
context = { path = "crates/context" }
state = { path = "crates/state" }
inference = { path = "crates/inference" }
memory = { path = "crates/memory" }
attention = { path = "crates/attention" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.43.0", features = ["bundled"] }
regex = "1.13.2"
