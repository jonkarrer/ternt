# Builds and publishes a release when a version tag (v1.2.3) is pushed; see
# scripts/release.sh. The release holds the .dmg for new installs plus the
# signed update archive and latest.json that installed copies poll
# (src-tauri/src/updater.rs).
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/ternt.key) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. Losing the key means installed copies
# can no longer be updated.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match tauri.conf.json version $version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile

      - name: Unit tests
        run: |
          bun test src
          bun run check
          cd src-tauri && cargo test --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          # One app for Apple Silicon and Intel.
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Ternt ${{ github.ref_name }}
          releaseBody: |
            Download **Ternt_*_universal.dmg** below, open it and drag Ternt to Applications.

            Ternt isn't notarized by Apple yet, so on first launch macOS blocks it. Allow it once with:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Ternt.app
            ```

            or open it, then System Settings → Privacy & Security → Open Anyway. Installed copies update themselves: a button appears at the bottom left of the sidebar.
          releaseDraft: false
          prerelease: false
          # Publishes latest.json, which installed copies check for updates.
          includeUpdaterJson: true
