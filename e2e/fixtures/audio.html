<!doctype html>
<title>Audio idle</title>
<style>
  body { margin: 0; }
  button { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
<!-- A click (a user gesture, so WebKit allows sound) starts a quiet tone:
     the unload test checks pages playing sound stay loaded. -->
<button>Play</button>
<script>
  document.querySelector("button").addEventListener("click", () => {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.02;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    ctx.resume();
    setInterval(() => (document.title = `Audio ${ctx.state}`), 200);
  });
</script>
