<title>Fixture IPC</title>

     lock window.ipc, so this script failed and the title stayed as above. -->

  }
  document.title = "ipc: " + ipc() + ", tauri: " + typeof window.__TAURI_INTERNALS__;
</script>

  <h1>IPC</h1>
</body>
