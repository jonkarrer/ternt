<!doctype html><title>cookie</title><body style="font:20px system-ui;padding:40px"><h1 id="h">cookie</h1>
<script>
  // ?set=x stores a cookie, ?clear removes it; the title reports what this
  // page's cookie jar holds. openPopup() opens a sign-in style popup that
  // reports the cookie it sees back to this page ("popup:<who>").
  const params = new URLSearchParams(location.search);
  if (params.has("set")) document.cookie = `who=${params.get("set")}; path=/; max-age=300`;
  if (params.has("clear")) document.cookie = "who=; path=/; max-age=0";
  const who = document.cookie.match(/who=([^;]*)/)?.[1] ?? "none";
  document.title = "cookie:" + who;
  document.getElementById("h").textContent = document.title;
  window.addEventListener("message", (e) => { document.title = "popup:" + e.data; });
  window.openPopup = () => window.open("/cookie-popup.html", "auth", "width=420,height=520");
</script></body>
